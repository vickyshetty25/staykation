# App
spring.application.name=staykation
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/staykation_db
spring.datasource.username=vickyshetty
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# JWT
jwt.secret=staykation-super-secret-key-2024-very-long-string-minimum-256-bits-required-for-hmac-sha
jwt.expiration=604800000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Image upload directory
app.upload.dir=uploads/images